<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hibrit">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Hibrit Antrenman</title>
<style>
:root{--bg:#0a0a0a;--c1:#161615;--c2:#1f1f1e;--c3:#2a2a28;--line:#2a2a28;--tx:#f2f1ec;--mut:#8b8a85;--acc:#b5f23d;--accd:#1d2a0b;--acct:#0a0a0a;--up:#b5f23d;--down:#ff6b6b;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
body.timing{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:8px 16px 32px}
h1{font-size:30px;line-height:1.15;margin:2px 0 4px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;line-height:1.3;margin:0;font-weight:650}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 6px;font-weight:600}
p{margin:0}
.mut{color:var(--mut);font-size:13px}
.acc{color:var(--acc)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--c3);border:1px solid transparent;border-radius:10px;padding:8px 10px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
textarea{min-height:90px;resize:vertical;line-height:1.4}
input:focus,textarea:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:#5f5e5a}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--c1);border-radius:16px;padding:14px;margin:10px 0;display:block;width:100%}
.card.hi{box-shadow:inset 0 0 0 1.5px var(--acc)}
.card.warn{color:var(--warn);font-size:14px}
.dh{display:flex;align-items:center;gap:12px}
.dh>div{flex:1;min-width:0}
.go{width:44px;height:44px;border-radius:50%;background:var(--c3);display:grid;place-items:center;color:var(--acc)}
.card.hi .go{background:var(--acc);color:var(--acct)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--c2);font-weight:600;padding:0 16px;text-align:center}
.btn.primary{background:var(--acc);color:var(--acct)}
.btn.wide{width:100%;margin:12px 0}
.btn.danger{color:var(--down);background:transparent;box-shadow:inset 0 0 0 1px #3a2222}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.ghost{color:var(--acc);font-size:16px;padding:10px 0}
.clock{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--accd);color:var(--acc);vertical-align:2px}
.tag.o{background:var(--c3);color:var(--mut)}
.block{background:var(--c1);border-radius:18px;padding:14px 12px 4px;margin:14px 0}
.bh{padding:0 2px 4px}
.note{font-size:13px;color:var(--mut);margin:2px 2px 8px}
.note summary{color:var(--acc);cursor:pointer;list-style:none}
.note summary::-webkit-details-marker{display:none}
.note ol{margin:6px 0 0;padding-left:20px}
.row{border-top:1px solid var(--line);padding:10px 0 12px}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rl{font-weight:650;font-size:14px}
.sub{font-size:11px;color:var(--warn);background:#2e2410;padding:1px 6px;border-radius:6px}
.sp{flex:1}
.mini{font-size:13px;padding:7px 10px;border-radius:9px;background:var(--c3);color:var(--tx);font-variant-numeric:tabular-nums}
.chk{width:42px;height:42px;border-radius:12px;background:var(--c3);display:grid;place-items:center;color:var(--mut)}
.row.done .chk{background:var(--acc);color:var(--acct)}
.row.done .cells{opacity:.6}
.cells.n2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cells.stack .cell+.cell{margin-top:12px}
.cell{min-width:0}
.cn{font-size:12px;color:var(--mut);margin-bottom:4px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;min-height:16px}
.cn .nm{overflow:hidden;text-overflow:ellipsis}
.cn .tg{margin-left:auto;color:var(--tx);font-weight:600;flex:none}
.ins{display:flex;gap:6px}
.f{position:relative;flex:1;min-width:0;display:block}
.stack .f{max-width:50%}
.f input{padding:8px 26px 8px 6px;text-align:center;font-weight:650;height:46px;font-variant-numeric:tabular-nums}
.f span{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mut);pointer-events:none}
.reps{display:flex;align-items:flex-end;gap:3px;margin-top:6px}
.reps>i{color:var(--mut);font-style:normal;padding-bottom:13px;font-size:12px}
.r{flex:1;min-width:0;display:block}
.r small{display:block;font-size:10px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.r input{text-align:center;padding:8px 2px;height:46px;font-weight:650}
.pv{font-size:12px;color:var(--mut);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv b{font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.eq{color:var(--mut)}
.li{display:flex;align-items:center;gap:8px;background:var(--c1);border-radius:14px;padding:6px 6px 6px 14px;margin:8px 0}
.li>.main{flex:1;min-width:0;padding:8px 0}
.li .t{font-weight:600}
.li .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--c3)}
.ib svg.i{width:20px;height:20px}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fld.inl{display:flex;align-items:center;gap:10px}
.fld.inl>span{flex:1;margin:0;font-size:15px;color:var(--tx)}
.fld.inl input{width:96px;text-align:center}
.fld.inl em{font-style:normal;color:var(--mut);font-size:13px;width:24px}
.chkf{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px}
.chkf input{width:24px;height:24px;padding:0;border-radius:7px;background:var(--c3);flex:none;position:relative}
.chkf input:checked{background:var(--acc)}
.chkf input:checked::after{content:"";position:absolute;left:8px;top:3px;width:5px;height:11px;border:solid var(--acct);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{padding:8px 12px;border-radius:10px;background:var(--c2);font-size:14px;color:var(--mut)}
.pill.on{background:var(--acc);color:var(--acct);font-weight:600}
.panel{background:var(--c1);border-radius:16px;padding:4px 14px;margin:10px 0}
.cyc{display:grid;grid-template-columns:22px 74px minmax(0,1fr) minmax(0,1fr) 34px;gap:6px;align-items:center;margin:6px 0}
.cyc input{text-align:center;height:42px}
.cyc.hd{font-size:11px;color:var(--mut);margin-bottom:0}
.flip{height:42px;border-radius:10px;background:var(--c3);font-size:13px;font-weight:600;text-align:center}
.flip.ba{color:var(--warn)}
.rnd{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;gap:6px;align-items:center;margin:6px 0}
.add{color:var(--acc);font-weight:600;padding:12px 0;display:flex;gap:6px;align-items:center;font-size:15px}
.desc{font-size:13px;color:var(--mut);margin:4px 0 8px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,14,13,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--mut)}
#tabs button.on{color:var(--acc)}
#timer{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:11;background:#16210a;border:1px solid #3b5a12;border-radius:16px;padding:10px 12px 8px;max-width:544px;margin:0 auto}
#timer[hidden]{display:none}
#timer .tb{display:flex;align-items:center;gap:8px}
#timer .tl{font-size:13px;color:#b9cf8f;flex:1}
#timer b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--acc);min-width:72px}
#timer button{height:38px;min-width:46px;border-radius:10px;background:#23330d;color:var(--tx);font-size:14px;font-weight:600;text-align:center}
#timer .tp{height:3px;background:#23330d;border-radius:2px;margin-top:8px;overflow:hidden}
#timer .tp i{display:block;height:100%;background:var(--acc);width:0}
#timer.end{background:var(--acc);border-color:var(--acc)}
#timer.end .tl,#timer.end b{color:var(--acct)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a2a28;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;transition:opacity .3s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast[hidden]{display:none}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<div id="timer" hidden>
  <div class="tb"><span class="tl" id="tlabel">Dinlenme</span><b id="tval">0:00</b><button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="0" aria-label="Sayacı kapat">✕</button></div>
  <div class="tp"><i id="tfill"></i></div>
</div>
<div id="toast" hidden></div>
<nav id="tabs"></nav>
<input type="file" id="importFile" accept="application/json,.json" class="hide">
<script src="app.js"></script>
</body>
</html>
